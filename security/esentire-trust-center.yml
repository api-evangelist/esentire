description: >-
  eSentire runs a published UpGuard trust page at trust.esentire.com. The page
  itself renders client-side and returns an HTML shell to any non-browser fetch,
  but the data behind it is served as public JSON at
  https://trust.esentire.com/api/trustpage/public/v1/ with no credentials, and
  that document is the source for everything recorded below. It is the richest
  machine-readable artifact eSentire publishes — considerably richer than anything
  on its own developer surface.
