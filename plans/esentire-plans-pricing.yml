description: >-
  eSentire publishes no prices. There is no pricing page — https://www.esentire.com/pricing
  returns 404 — and no self-service sign-up for the API or the platform. The closest
  published artifact is an interactive "Build Your eSentire MDR Package" selector,
  which lets a prospect assemble a service bundle (MDR for Endpoint, Network, Log,
  Cloud, Identity; DFIR; CTEM/Exposure Management) and then routes to a
  speak-with-an-expert form. It attaches no price, no quota, and no tier to any
  selection. Service scope and inclusions are published in far more detail at
  contracts.esentire.com, the public services catalogue — but that catalogue is a
  description of what each service does, not a rate card. This is enterprise
  contract sales end to end: the commercial terms for the API, including whether it
  is included in a subscription or priced separately, are not discoverable without
  talking to eSentire.
