  reachable without credentials. Two paths return real documents, both on the API
  host: RFC 8414 OAuth 2.0 Authorization Server Metadata and RFC 9728 OAuth 2.0
  Protected Resource Metadata. Both are the discovery documents the MCP
  authorization flow depends on, and both were saved verbatim. Everything else
  missed. Two hosts are recorded as SPA catch-alls: atlas.esentire.com (the Atlas
  / Insight portal, which insight.esentire.com now redirects to) answers 200 with
  an identical 2,151-byte HTML shell for every path including /.well-known/agent-card.json,
  and trust.esentire.com does the same with a 1,083-byte shell. Neither is a
  document; both are recorded as misses so the shell is never miscounted as a hit.
