    method: POST
    http_status: 401
    note: Control probe. A nonsense path UNDER /mcp/ still 401s, which means the gateway routes /mcp/{proxy+}
      as one authorized resource — the exact sub-path of the transport endpoint cannot be narrowed further
      from outside.
  - url: https://api.esentire.com/graphql
    method: POST
    http_status: 403
    note: Control probe OUTSIDE /mcp/. 403 MISSING_AUTHENTICATION_TOKEN = no such route. This is what
