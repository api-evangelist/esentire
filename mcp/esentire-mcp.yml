generated: '2026-08-12'
method: probed
source: https://api.esentire.com/mcp
name: eSentire MCP Server
status: live-gated
description: 'eSentire operates a Model Context Protocol server on its own API host. It was found by probe,
  not by documentation — eSentire publishes no developer portal and no page describing this server. The
  evidence is unambiguous: api.esentire.com is an AWS API Gateway that answers unrouted paths with 403
  MISSING_AUTHENTICATION_TOKEN, but every path under /mcp/ answers 401 UNAUTHORIZED and carries the RFC
  9728 challenge header `WWW-Authenticate: Bearer resource_metadata="https://api.esentire.com/.well-known/oauth-protected-resource"`.
  That header is the Model Context Protocol authorization pattern verbatim, and the resource-metadata
  document it names resolves and points back at the same host. Authorization is Okta-backed OAuth 2.0
  authorization code with PKCE (S256), and RFC 7591 dynamic client registration is open anonymously at
  https://api.esentire.com/register.'
transport: streamable-http (inferred from the /mcp path prefix and the RFC 9728 challenge; not confirmed
  without a token)
endpoint: https://api.esentire.com/mcp
authorization:
  required: true
  scheme: OAuth 2.0 Bearer
  challenge_header: 'WWW-Authenticate: Bearer resource_metadata="https://api.esentire.com/.well-known/oauth-protected-resource"'
  protected_resource_metadata: https://api.esentire.com/.well-known/oauth-protected-resource
  authorization_server_metadata: https://api.esentire.com/.well-known/oauth-authorization-server
  issuer: https://esentire.okta.com
  authorization_endpoint: https://esentire.okta.com/oauth2/v1/authorize
  token_endpoint: https://esentire.okta.com/oauth2/v1/token
  revocation_endpoint: https://esentire.okta.com/oauth2/v1/revoke
  end_session_endpoint: https://esentire.okta.com/oauth2/v1/logout
  registration_endpoint: https://api.esentire.com/register
  dynamic_client_registration: true
  grant_types:
  - authorization_code
  pkce: S256
  scopes:
  - openid
  - profile
  - email
tools:
  count: null
  listed: false
  note: NOT RECORDED. POST {"jsonrpc":"2.0","id":1,"method":"tools/list"} to every candidate path under
    /mcp/ returned 401 UNAUTHORIZED. The live tool set and its inputSchemas require an authenticated eSentire
