aid: esentire
name: eSentire
description: 'eSentire, Inc. is a Waterloo, Ontario-headquartered cybersecurity company
  and, in its own words, "the Authority in Managed Detection and Response (MDR)".
  Founded in 2001, it protects 2,000+ organizations across 80+ countries and 35 industries
  with 24/7/365 Managed Detection and Response, Digital Forensics and Incident Response
  (DFIR), and Continuous Threat Exposure Management (CTEM), delivered from its own
  Atlas Security Operations Platform and staffed Security Operations Centers. Its
  public machine-readable surface is narrow but real: an llms.txt at the marketing
  host, an OAuth 2.0 authorization-server and protected-resource metadata pair at
  api.esentire.com, and an authorization-gated MCP server behind that same host.
  There is no public OpenAPI, GraphQL schema, or developer portal — the API and the
  Atlas/Insight portal are reachable only by contracted customers and partners.'
