description: >-
  eSentire ships no current client library for any of its APIs. The registries were
  searched directly (npm search + registry metadata, PyPI JSON API, and the eSentire
  GitHub organization's 33 repositories) and exactly one first-party package exists
  — `cymon` on PyPI — which wraps Cymon.io, a threat-intelligence service eSentire
  acquired and then shut down. Its only release is from 2015. It is recorded here
  because it is genuinely first-party and its date is the finding, not because it is
  usable. No SDK exists for the current eSentire API or for the MCP server, and no
  `SDKs` pointer is emitted for this repo: crediting eSentire with an SDK on the
  strength of an eleven-year-old wrapper for a decommissioned product would be
  false credit.
