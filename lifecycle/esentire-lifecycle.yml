gaps:
- No published versioning policy, so a customer integrating against /v1 has no stated support window.
- No deprecation policy and no Sunset/Deprecation headers, so breaking changes arrive without a machine-readable warning.
- No public status page, so integration health cannot be checked without logging in.
- No API changelog, so there is no record of what changed or when.
