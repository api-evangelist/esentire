description: >-
  What eSentire publishes about versioning, deprecation, availability and change
  for its API surface. The answer is nothing. There is no developer portal, no
  changelog, no status page, no deprecation policy and no published SLA reachable
  without a customer contract. The only version signal is inferential — routing
  behaviour on the API gateway implies a /v1 path segment. Service-level commitments
  exist but live in the contracted services catalogue, not in a developer document.
